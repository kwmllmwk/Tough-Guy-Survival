org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false

# 本模组的目标平台是 Minecraft 26.3 / NeoForge 26.3.x，需要 Java 25。
# 注意：NeoForm 2.0.27 在重编译 Minecraft 源码时不会传递 --enable-preview，
# 而 26.3 的源码使用了 Java 25 的未命名变量语法，所以 createMinecraftArtifacts 会失败。
# 因此请不要依赖 Gradle 的 NeoForge 任务构建本模组，
# 具体可用的构建方式见 README 的「构建说明」一节。
#
# 下面这行是本机 JDK 路径，仅供原作者使用；克隆本项目的人请改成自己的路径，
# 或者直接删掉这一行（Gradle 会使用 JAVA_HOME）。
org.gradle.java.installations.paths=C:\\Program Files\\Microsoft\\jdk-25.0.3.9-hotspot
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
