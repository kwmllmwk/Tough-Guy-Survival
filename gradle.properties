org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false

# Minecraft 26.3 的源码使用 Java 25 的未命名变量语法，必须用 Java 25 编译。
# 但 NeoForm 2.0.27 在重编译阶段不会传递 --enable-preview，导致 createMinecraftArtifacts 失败，
# 因此这里仅用于让 Gradle 能解析工具链；实际编译流程见 README 的「构建说明」。
org.gradle.java.installations.paths=C:\\Program Files\\Microsoft\\jdk-25.0.3.9-hotspot
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
