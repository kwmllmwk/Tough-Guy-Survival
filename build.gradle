plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = '1.0.3'
group = 'com.mengnan'

// 本模组的目标平台是 Minecraft 26.3，其源码使用 Java 25 的未命名变量语法，
// 因此工具链必须是 Java 25（写 21 会编译失败）。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

neoForge {
    // 与实例实际运行的 NeoForge 版本保持一致（见启动参数 --fml.neoForgeVersion）
    version = '26.3.0.35-beta'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        mengnansurvival {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 把项目根目录的 README.md 与 LICENSE 一并打进 jar（放在 jar 根目录）。
// - README.md：模组会在玩家第一次进入世界时读取它，生成一本名为 README 的成书。
// - LICENSE：GPL-3.0 要求分发时附带完整许可证全文。
tasks.named('processResources', ProcessResources) {
    from(rootProject.file('README.md')) {
        into ''
    }
    from(rootProject.file('LICENSE')) {
        into ''
    }
}
